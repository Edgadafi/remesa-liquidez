# Render — Remesa TIA Backend (holatia.app)
# Desplegar como servicio nuevo; apuntar RENDER_BACKEND_URL del proyecto Vercel `web` a la URL TIA.

services:
  - type: web
    name: remesa-tia-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    region: oregon
    plan: free
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "3000"
      - key: BOT_INTERNAL_URL
        sync: false
      - key: BOT_INTERNAL_SECRET
        sync: false
      - key: TIA_ALLOW_NOTIFY_WITHOUT_BOT
        value: "false"
      - key: TIA_MANUAL_OVERRIDE_SECRET
        sync: false
      - key: BLINK_BASE_URL
        value: https://web-coral-pi-66.vercel.app
      - key: ELEVENLABS_API_KEY
        sync: false
      - key: ELEVENLABS_VOICE_ID
        value: EXAVITQu4vr4xnSDxMaL
      # Nirium x402 — premium API (/premium/*). Facilitator key: channels.openzeppelin.com/testnet/gen
      - key: NIRIUM_X402_ENABLED
        value: "false"
      - key: STELLAR_NETWORK
        value: testnet
      - key: STELLAR_PAY_TO
        sync: false
      - key: X402_FACILITATOR_API_KEY
        sync: false
      - key: NIRIUM_X402_BRIDGE_PRICE
        value: "0.02"
      - key: NIRIUM_X402_FX_PRICE
        value: "0.01"
